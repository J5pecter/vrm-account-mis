<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>VRM Account MIS</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700;125,800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="topline" id="topline" aria-hidden="true"></div>

<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="card">
    <div class="spinner" id="boot-spin"></div>
    <h1>VRM Account MIS</h1>
    <p id="boot-msg">Loading…</p>
    <div id="boot-actions" class="actions" hidden></div>
  </div>
</div>

<div id="auth" class="auth" hidden></div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-5"/></svg></div>
      <div><div class="bt">VRM Account MIS</div><div class="bs">Client-code activations</div></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <button class="userchip" type="button" data-action="go" data-route="account" aria-label="Your account">
        <span class="uava" id="user-ava" aria-hidden="true">?</span>
        <span class="uinfo"><span class="uname" id="user-name">—</span><span class="urole" id="user-role"></span></span>
      </button>
      <button class="sync" type="button" id="sync" data-action="refresh" aria-live="polite">
        <span class="dot wait" id="sync-dot" aria-hidden="true"></span><span id="sync-text">Connecting…</span>
      </button>
      <button class="logout" type="button" data-action="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out
      </button>
    </div>
  </aside>
  <div class="backdrop" data-action="close-side" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn" type="button" id="menu-btn" data-action="toggle-side" aria-label="Show or hide navigation" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="titles"><h1 class="tt" id="page-title">Dashboard</h1><p class="ts" id="page-sub"></p></div>
      <button class="icon-btn theme-btn" type="button" data-action="toggle-theme" aria-label="Switch light or dark theme">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
      <div class="date-chip" title="Business date (India Standard Time)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="today-label">—</span>
      </div>
    </header>
    <main id="main" class="wrap" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="assertive"></div>
<noscript><p class="banner err">VRM Account MIS needs JavaScript enabled.</p></noscript>

<script src="config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
